<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ระบบจัดการรับสมัครนักเรียน @ โรงเรียนปากช่อง</title>
    <link rel="icon" type="image/x-icon" href="Logo.png">
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* ป้องกันการเลื่อนหน้าจอขณะโหลด */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        } 
        /* สร้าง Class ส่วนกลางสำหรับจัดกึ่งกลาง */
        .full-screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- หน้าแจ้งเตือน Facebook (ปรับให้ใช้ class กึ่งกลาง) -->
    <div id="FBloading" class="full-screen-center" style="display:none;">
        <h4 style="font-family: 'Sarabun', sans-serif; line-height: 1.6;">
            โปรดเปิดด้วย เบราว์เซอร์ภายนอก <br>
            <span style="color: #666; font-size: 0.9em;">Please open in external browser.</span>
        </h4>       
    </div>  

    <!-- หน้า Loading หลัก -->
    <div id="loading" class="full-screen-center" style="transition: opacity 0.5s ease-out;">
        <dotlottie-player src="https://lottie.host/3924723b-b000-47d9-877a-48fc904e0c67/UiIOpIdURz.lottie" 
            background="transparent" speed="1" style="width: 300px; height: 300px" loop autoplay>
        </dotlottie-player>
        <h4 style="color: #333; font-family: 'Sarabun', sans-serif; font-weight: bold; margin-top: 20px;">
            กำลังตรวจสอบความปลอดภัย
        </h4>
    </div>
    
    <iframe style="display:none" id="link" enctype="multipart/form-data" scrolling="auto" src=""></iframe>
    
    <script type="text/javascript">
        let preloader = document.getElementById("loading");
        let FBloading = document.getElementById("FBloading");
        let link = document.getElementById("link");
        let idUID = window.location.search;
        let param = new URLSearchParams(idUID);
        let id = param.get('fbclid');
        let idApply = param.get('id');
        
        function getNoCacheUrl(baseUrl, params = "") {
            let sep = baseUrl.includes('?') ? '&' : '?';
            return baseUrl + params + sep + "t=" + new Date().getTime();
        }

        /* ตั้งแต่ 29 ก.ย. 2569 ชี้ไปโปรเจกต์ standalone "ระบบแอดมินรับสมัคร 2570" (ไม่ผูกกับชีตแล้ว)
           อัปเดตระบบให้แก้ deployment นี้เป็นเวอร์ชันใหม่ ห้ามสร้าง New deployment เพราะจะได้ /exec ใหม่
           deployment เดิมของสคริปต์ที่ผูก V4Admin-Admission69 ปิดแล้ว (29 ก.ย. 2569)
           หน้านี้ฝังระบบในกรอบถ้าเบราว์เซอร์ยอม ไม่ยอมก็เปิดเต็มหน้า (ดูด้านล่าง) */
        /* แบบ /a/macros/pcschool.ac.th/ ให้ Google เลือกบัญชีของโรงเรียน เมื่อเครื่องล็อกอินไว้หลายบัญชี */
        const baseAppScript = "https://script.google.com/a/macros/pcschool.ac.th/s/AKfycbzqNQTb1K5BgsHG9lme2uzDzdw2H6fxLe042twStbrLlQfOk7B5NwSjz4PjzOzNX_HUsg/exec";

        // ฟังก์ชันช่วยปิด Loading แบบนิ่มนวล
        function hideLoader() {
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        }

        if(id){
            preloader.style.display = 'none';
            FBloading.style.display = 'flex'; // ใช้ flex เพื่อให้กึ่งกลาง
            // ... (โค้ดหน่วงเวลาเดิมของคุณ) ...
            let countDownDate = new Date(Date.now() + 15000).getTime();   	
            let x = setTimeout(function(){
                let now = new Date().getTime();
                let distance = countDownDate - now;                
                let seconds = Math.floor((distance % (1000 * 60)) / 1000);
                if(seconds == 13){
                    FBloading.innerHTML = `<iframe scrolling="auto" src="openExternalBrowser.mp4"></iframe>`
                } else if(seconds <= 0){
                    clearInterval(x);
                    window.location.href = 'https://pcschool-dev.github.io/admin'
                }  				
            }, 1000); // ทุก ๆ 1 วิ
        
        } else {
            /* ลองฝังในกรอบก่อน แถบที่อยู่จะยังเป็น pcschool-dev.github.io/admin
               ระบบแอดมินเปิดให้เฉพาะบัญชีโรงเรียน ต้องใช้การล็อกอิน Google ซึ่งมือถือและ Safari
               ไม่ส่งให้หน้าที่ฝังในกรอบของเว็บอื่น Google จึงตอบ 401 (ได้หน้า error ในกรอบ)
               ระบบแอดมินส่งสัญญาณ { pc: 'admin-ready' } มาเมื่อเปิดขึ้นจริง (js.html ต้นไฟล์)
               ได้สัญญาณ: แสดงกรอบ  ไม่ได้สัญญาณ: เปิดระบบเต็มหน้าแทน (ลิงก์จะเป็น script.google.com)
               กรอบซ่อนอยู่ใต้หน้าโหลดจนกว่าจะได้สัญญาณ ผู้ใช้จึงไม่เห็นหน้า 401 */
            const finalUrl = idApply ? baseAppScript + '?id=' + encodeURIComponent(idApply) : baseAppScript;
            const GRACE_AFTER_LOAD_MS = 6000;   // กรอบโหลดเสร็จแล้ว รอสัญญาณอีกเท่านี้
            const MAX_WAIT_MS = 30000;          // กรอบไม่โหลดเลย (เน็ตช้า) รอสูงสุดเท่านี้
            let ready = false, fallbackTimer = null;

            function openFullPage() {
                if (ready) return;
                const h = document.querySelector('#loading h4');
                if (h) h.innerHTML = 'กำลังไปที่ระบบอนุมัติ…<br><small style="font-weight:normal">ถ้าหน้าไม่เปลี่ยนเอง '
                    + '<a href="' + finalUrl + '" target="_top" style="color:#8b1a1a">กดที่นี่</a></small>';
                try {
                    if (window.top !== window.self) window.top.location.replace(finalUrl);
                    else window.location.replace(finalUrl);
                } catch (e) {
                    window.location.replace(finalUrl);
                }
            }

            window.addEventListener('message', function (ev) {
                if (ev.source !== link.contentWindow && !String(ev.origin).endsWith('.googleusercontent.com')) return;
                if (!ev.data || ev.data.pc !== 'admin-ready' || ready) return;
                ready = true;
                clearTimeout(fallbackTimer);
                hideLoader();
                link.style.display = 'block';
            });

            link.onload = function () {
                if (ready) return;
                clearTimeout(fallbackTimer);
                fallbackTimer = setTimeout(openFullPage, GRACE_AFTER_LOAD_MS);
            };
            fallbackTimer = setTimeout(openFullPage, MAX_WAIT_MS);
            link.src = getNoCacheUrl(finalUrl);
        }
    </script>
</body>    
</html>
